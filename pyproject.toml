[project]
name = "track_vis"
version = "0.2.0"
description = "three.js 3D event display for particle tracks, truth vertices and voxel images"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "awkward>=2.9.4",
    "numpy>=2.2.6",
    "uproot>=5.7.5",
]

[project.optional-dependencies]
particle = [
    "particle>=0.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "jupyter>=1.1.1",
    "pre-commit>=4.0.1",
    "nbstripout>=0.8.1",
    "playwright>=1.48",
]
