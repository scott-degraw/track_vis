name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Lint and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --locked --group dev
      - name: Ruff
        run: |
          uvx ruff check .
          uvx ruff format --check .
      - name: Pytest
        run: uv run pytest -q

  browser:
    name: Render in headless Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install
        run: |
          uv sync --locked --group dev
          uv run playwright install --with-deps chromium
      - name: Smoke test the JavaScript renderer
        env:
          TRACK_VIS_REQUIRE_BROWSER: "1"
        run: uv run pytest -q tests/test_render_in_browser.py
